<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Status: Antre (coffee cup + clock)</title>
  <!-- coffee cup -->
  <rect x="2" y="3" width="7" height="6" fill="#8B4513"/>
  <rect x="1" y="2" width="9" height="2" fill="#A0522D"/>
  <rect x="9" y="4" width="2" height="3" fill="none" stroke="#8B4513" stroke-width="1"/>
  <rect x="3" y="4" width="3" height="3" fill="#F5DEB3"/>
  <rect x="2" y="9" width="7" height="1" fill="#8B4513"/>
  <!-- clock -->
  <circle cx="12" cy="11" r="4" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1"/>
  <rect x="11" y="10" width="1" height="3" fill="#2C3E50"/>
  <rect x="11" y="10" width="2" height="1" fill="#2C3E50"/>
</svg>