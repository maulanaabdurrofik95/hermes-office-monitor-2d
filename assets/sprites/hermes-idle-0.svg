<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <title>Hermes chibi idle frame 0</title>
  <!-- shadow -->
  <rect x="12" y="44" width="24" height="2" fill="#000000" opacity="0.18"/>
  <!-- legs -->
  <rect x="17" y="36" width="5" height="8" fill="#2C3E50"/>
  <rect x="26" y="36" width="5" height="8" fill="#2C3E50"/>
  <!-- body (gold #FFD700) -->
  <rect x="14" y="25" width="20" height="11" fill="#FFD700"/>
  <rect x="14" y="25" width="20" height="2" fill="#DAA520"/>
  <!-- arms relaxed -->
  <rect x="10" y="27" width="5" height="8" fill="#FFD700"/>
  <rect x="33" y="27" width="5" height="8" fill="#FFD700"/>
  <!-- hands -->
  <rect x="10" y="35" width="5" height="2" fill="#F4C29A"/>
  <rect x="33" y="35" width="5" height="2" fill="#F4C29A"/>
  <!-- head -->
  <rect x="15" y="13" width="18" height="12" fill="#F4C29A"/>
  <rect x="15" y="13" width="18" height="2" fill="#E0A97A"/>
  <!-- hair (gold crown-ish) -->
  <rect x="15" y="11" width="18" height="3" fill="#FFD700"/>
  <rect x="17" y="9" width="2" height="3" fill="#FFD700"/>
  <rect x="21" y="8" width="2" height="4" fill="#FFD700"/>
  <rect x="25" y="9" width="2" height="3" fill="#FFD700"/>
  <!-- eyes -->
  <rect x="19" y="18" width="3" height="3" fill="#2C3E50"/>
  <rect x="26" y="18" width="3" height="3" fill="#2C3E50"/>
  <!-- small sparkles -->
  <rect x="16" y="16" width="1" height="1" fill="#FFF"/>
  <rect x="28" y="16" width="1" height="1" fill="#FFF"/>
  <!-- smile -->
  <rect x="22" y="22" width="4" height="1" fill="#DAA520"/>
  <!-- accessory: headset -->
  <rect x="13" y="12" width="22" height="2" fill="#2C3E50"/>
  <rect x="13" y="12" width="2" height="7" fill="#2C3E50"/>
  <rect x="33" y="12" width="2" height="7" fill="#2C3E50"/>
  <!-- tablet -->
  <rect x="35" y="25" width="8" height="6" fill="#2C3E50"/>
  <rect x="36" y="26" width="6" height="4" fill="#FFD700" opacity="0.6"/>
</svg>