<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <title>Dev chibi idle frame 0</title>
  <!-- background transparent -->
  <!-- shadow -->
  <rect x="12" y="44" width="24" height="2" fill="#000000" opacity="0.18"/>
  <!-- legs -->
  <rect x="17" y="36" width="5" height="8" fill="#2C3E50"/>
  <rect x="26" y="36" width="5" height="8" fill="#2C3E50"/>
  <!-- body (shirt, sea blue #4A90D9) -->
  <rect x="14" y="25" width="20" height="11" fill="#4A90D9"/>
  <rect x="14" y="25" width="20" height="2" fill="#357ABD"/>
  <!-- arms relaxed -->
  <rect x="10" y="27" width="5" height="8" fill="#4A90D9"/>
  <rect x="33" y="27" width="5" height="8" fill="#4A90D9"/>
  <!-- hands -->
  <rect x="10" y="35" width="5" height="2" fill="#F4C29A"/>
  <rect x="33" y="35" width="5" height="2" fill="#F4C29A"/>
  <!-- head -->
  <rect x="15" y="13" width="18" height="12" fill="#F4C29A"/>
  <rect x="15" y="13" width="18" height="2" fill="#E0A97A"/>
  <!-- hair (dark) -->
  <rect x="15" y="12" width="18" height="3" fill="#2C3E50"/>
  <rect x="15" y="12" width="3" height="2" fill="#1A252F"/>
  <!-- eyes -->
  <rect x="19" y="18" width="3" height="3" fill="#2C3E50"/>
  <rect x="26" y="18" width="3" height="3" fill="#2C3E50"/>
  <!-- glasses -->
  <rect x="18" y="17" width="5" height="5" fill="none" stroke="#2C3E50" stroke-width="1"/>
  <rect x="25" y="17" width="5" height="5" fill="none" stroke="#2C3E50" stroke-width="1"/>
  <rect x="23" y="19" width="2" height="1" fill="#2C3E50"/>
  <!-- smile -->
  <rect x="22" y="22" width="4" height="1" fill="#C0392B"/>
  <!-- accessory: laptop on lap -->
  <rect x="15" y="30" width="10" height="6" fill="#34495E"/>
  <rect x="15" y="30" width="10" height="1" fill="#2C3E50"/>
  <rect x="16" y="31" width="4" height="3" fill="#4A90D9" opacity="0.7"/>
  <!-- headphones (domain accessory) -->
  <rect x="13" y="12" width="22" height="2" fill="#2C3E50"/>
  <rect x="13" y="12" width="2" height="8" fill="#2C3E50"/>
  <rect x="33" y="12" width="2" height="8" fill="#2C3E50"/>
</svg>